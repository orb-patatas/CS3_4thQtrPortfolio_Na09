<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 2nd Graded - Movie Rating with UD</title>
    <link rel="stylesheet" href="../public/stylesheets/q42gNaCandelaria.css">
</head>
<body>

    <h1>Rate This Movie !</h1>

    <form id="movieForm">
        <fieldset>
            <legend>Movie Details</legend>
            
            <label for="movieTitle">Movie Title</label>
            <input type="text" id="movieTitle" placeholder="Enter movie name" required>

            <label for="movieGenre">Genre</label>
            <select id="movieGenre" required>
                <option value="" disabled selected>Select a genre</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Romance">Romance</option>
                <option value="Animation">Animation</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Rate This Movie</legend>
            <label>Click stars to rate</label>
            <div class="star-rating-container">
                <input type="radio" id="star5" name="rating" value="5" /><label for="star5" title="5 stars">★</label>
                <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="4 stars">★</label>
                <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="3 stars">★</label>
                <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="2 stars">★</label>
                <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="1 star">★</label>
            </div>
        </fieldset>

        <div class="button-group">
            <button type="submit" class="toggle-btn submit-btn">Add/Update Movie</button>
        </div>
    </form>

    <div class="movie-list-section">
        <h2>Movie List</h2>
        <div id="movieListContainer">
            <p style="text-align:center; color:#f1c4ac;">No movies rated yet.</p>
        </div>
    </div>

    <script>
        const movieForm = document.getElementById('movieForm');
        const movieListContainer = document.getElementById('movieListContainer');
        
        // localStorage key for data persistence
        const STORAGE_KEY = 'movie_ratings_data';

        function getMoviesFromStorage() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            return storedData ? JSON.parse(storedData) : [];
        }

        function saveMoviesToStorage(movies) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
        }

        function findMovieByTitle(movies, title) {
            return movies.findIndex(movie => 
                movie.title.toLowerCase() === title.toLowerCase().trim()
            );
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMovieList() {
            const movies = getMoviesFromStorage();
            movieListContainer.innerHTML = ''; 

            if (movies.length === 0) {
                movieListContainer.innerHTML = '<p style="text-align:center; color:#f1c4ac;">No movies rated yet.</p>';
                return;
            }

            movies.forEach((movie, index) => {
                const movieItem = document.createElement('div');
                movieItem.classList.add('movie-item');

                let starsHTML = '';
                for(let i = 0; i < Math.round(movie.rating); i++) {
                    starsHTML += '★';
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.classList.add('delete-btn');
                deleteBtn.setAttribute('aria-label', `Delete ${escapeHtml(movie.title)}`);
                deleteBtn.addEventListener('click', () => handleDeleteMovie(index));

                movieItem.innerHTML = `
                    <div class="movie-info">
                        <h3>${escapeHtml(movie.title)}</h3>
                        <span class="movie-genre">${escapeHtml(movie.genre)}</span>
                    </div>
                    <div class="display-stars" title="Rating: ${movie.rating.toFixed(1)}/5">
                        ${starsHTML}
                    </div>
                `;
                
                movieItem.appendChild(deleteBtn);
                movieListContainer.appendChild(movieItem);
            });
        }

        function handleDeleteMovie(index) {
            if (confirm('Are you sure you want to delete this movie?')) {
                const movies = getMoviesFromStorage();
                movies.splice(index, 1); 
                saveMoviesToStorage(movies); 
                renderMovieList(); 
            }
        }

        
        movieForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const title = document.getElementById('movieTitle').value.trim();
            const genre = document.getElementById('movieGenre').value;
            const ratingInput = document.querySelector('input[name="rating"]:checked');
            
            if (!ratingInput) {
                alert("Please select a star rating!");
                return;
            }

            const newRating = parseInt(ratingInput.value);
            const movies = getMoviesFromStorage();
            const existingIndex = findMovieByTitle(movies, title);
            
            if (existingIndex !== -1) {
                const existingMovie = movies[existingIndex];
                const averagedRating = (existingMovie.rating + newRating) / 2;
                
                movies[existingIndex] = {
                    title: title,
                    genre: genre,
                    rating: averagedRating
                };
                
                alert(`✓ "${title}" updated!\nNew averaged rating: ${averagedRating.toFixed(1)}/5`);
            } else {
                const newMovie = {
                    title: title,
                    genre: genre,
                    rating: newRating
                };
                movies.push(newMovie);
                alert(`✓ "${title}" added successfully!`);
            }

            saveMoviesToStorage(movies);
            renderMovieList();
            movieForm.reset(); 
        });

        renderMovieList();
    </script>
</body>
</html>
